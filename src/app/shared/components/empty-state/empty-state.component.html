<div class="d-flex flex-column align-items-center justify-content-center text-center p-5 bg-white rounded shadow-sm border">
  <div class="mb-3 text-muted">
    <i class="bi {{ icon }}" style="font-size: 3rem;"></i>
  </div>
  <h4 class="fw-bold mb-2">{{ title }}</h4>
  <p class="text-muted mb-4">{{ message }}</p>
  <button *ngIf="actionText" class="btn btn-primary px-4 rounded-pill" (click)="onAction()">
    {{ actionText }}
  </button>
</div>
