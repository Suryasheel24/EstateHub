<div class="card h-100 border-0 property-card bg-white" style="border-radius: var(--radius-lg, 18px);">
  <div class="position-relative overflow-hidden card-img-wrapper" style="aspect-ratio: 16/10; border-top-left-radius: var(--radius-lg, 18px); border-top-right-radius: var(--radius-lg, 18px);">
    <img [src]="property.imageUrl" class="card-img-top property-img w-100 h-100 object-fit-cover" [alt]="property.title">
    <div class="position-absolute top-0 start-0 m-3 d-flex gap-2">
      <span class="badge text-white px-3 py-2 rounded-pill fw-medium text-uppercase shadow-sm" style="background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1);">{{ property.transactionType }}</span>
      <span class="badge text-white px-3 py-2 rounded-pill fw-medium shadow-sm" *ngIf="property.rating >= 4.8" style="background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1);"><i class="bi bi-shield-check me-1 text-accent"></i> Verified</span>
    </div>
  </div>
  <div class="card-body d-flex flex-column p-4">
    <div class="d-flex justify-content-between align-items-start mb-2">
      <h5 class="card-title fw-bold text-truncate mb-0 text-brand-navy" [title]="property.title">{{ property.title }}</h5>
      <span class="badge bg-light text-dark shadow-sm rounded-pill px-2 py-1 border"><i class="bi bi-star-fill text-accent me-1"></i>{{ property.rating }}</span>
    </div>
    <p class="text-muted small mb-3"><i class="bi bi-geo-alt-fill me-1 text-accent"></i>{{ property.location }}</p>
    
    <!-- Specs Ribbon (Subtle Pills) -->
    <div class="d-flex flex-wrap gap-2 mb-4 text-muted small fw-medium">
      <span class="bg-tertiary px-3 py-1 rounded-pill"><i class="bi bi-moon-fill me-1 opacity-75"></i>{{ property.bedrooms }} Beds</span>
      <span class="bg-tertiary px-3 py-1 rounded-pill"><i class="bi bi-droplet-fill me-1 opacity-75"></i>{{ property.bathrooms }} Baths</span>
      <span class="bg-tertiary px-3 py-1 rounded-pill"><i class="bi bi-arrows-angle-expand me-1 opacity-75"></i>{{ property.area }} sq.ft</span>
    </div>
    
    <div class="mt-auto d-flex justify-content-between align-items-center border-top pt-3">
      <div>
        <span class="fs-4 fw-bolder text-brand-navy" style="font-variant-numeric: tabular-nums;">{{ formattedPrice }}</span>
        <span class="text-muted small fw-medium" *ngIf="property.transactionType === 'rent'">/mo</span>
      </div>
      <a [routerLink]="['/property', property.id]" class="btn btn-primary rounded-pill px-4 fw-bold">View</a>
    </div>
  </div>
</div>
